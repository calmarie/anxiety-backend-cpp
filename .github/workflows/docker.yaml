name: Docker build

'on':
    schedule:
      - cron: '30 5 * * 1'  # Every Monday at 5:30
    pull_request:
    push:
        branches:
          - master
          - develop
          - feature/**

env:
    UBSAN_OPTIONS: print_stacktrace=1

jobs:
    tests:
        runs-on: ubuntu-latest

        services:
            redis:
                image: redis:7-alpine
                ports:
                  - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
          - uses: actions/checkout@v7
            with:
                submodules: true

          - name: Reuse ccache directory
            uses: actions/cache@v4
            with:
                path: .ccache
                key: 'ccache-dir-${{github.ref}}_run-${{github.run_number}}'
                restore-keys: |
                    ccache-dir-${{github.ref}}_run-
                    ccache-

          - name: Cmake
            run: make docker-cmake-debug

          - name: Build
            run: make docker-build-debug
  
          - name: Test
            env:
                SECDIST_CONFIG: ${{ secrets.SECDIST_CONFIG }}
            run: make docker-test-debug