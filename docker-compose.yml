services:
  backend:
    image: anxiety-cpp
    build:
      context: ./ 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_CONNECTION: ${DB_CONNECTION}
    ports:
      - "8080:8080"
    volumes:
    - ./secdist.docker.json:/app/secdist.docker.json:ro
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
    - pg-data:/var/lib/postgresql

  redis:
    image: redis:8.10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
    - redis-data:/data

volumes:
  pg-data: 
  redis-data: 


